schemaVersion: 2.2.2
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: "rhdh-local"
  provider: Red Hat
  displayName: RHDH Local
  description: RHDH Local in Dev Spaces
  tags:
    - RHDH
    - Podman
    - Local
  projectType: RHDH
  language: YAML
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      args: ['tail', '-f', '/dev/null']
      mountSources: true
      cpuLimit: '4'
      cpuRequest: '500m'
      memoryLimit: '8G'
      memoryRequest: '2G'
      endpoints:
        - name: rhdh-route
          targetPort: 7007
          exposure: public
          secure: true
commands:
  - id: podman-compose-up
    exec:
      commandLine: "podman compose -f compose-devspaces.yaml up -d"
      component: tools
  - id: podman-compose-down
    exec:
      commandLine: "podman compose -f compose-devspaces.yaml down"
      component: tools
  - id: podman-compose-start
    exec:
      commandLine: "podman compose start"
      component: tools
  - id: podman-compose-stop
    exec:
      commandLine: "podman compose stop"
      component: tools
  - id: install-podman-compose
    exec:
      component: tools
      commandLine: |
        if [ ! -f ~/.docker/cli-plugins/docker-compose ]; then
          echo "Installing docker-compose CLI plugin..."
          mkdir -p ~/.docker/cli-plugins
          curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          echo "docker-compose plugin installation complete."
        else
          echo "docker-compose CLI plugin already exists, skipping download."
        fi
  - id: start-podman-service
    exec:
      commandLine: "podman system service --time 0 &"
      component: tools
  - id: sync-env-url
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        cd "${PROJECT_SOURCE:-/projects}"

        echo "Waiting for dynamic OpenShift Route for RHDH..."
        
        # 1. Initialize .env from default.env if missing
        if [ -f default.env ] && [ ! -f .env ]; then
          cp default.env .env
          echo "Initialized .env from default.env"
        fi

        # 2. Determine current OpenShift namespace from service account
        NAMESPACE=""
        if [ -f /var/run/secrets/kubernetes.io/serviceaccount/namespace ]; then
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        fi

        NS_ARG=""
        if [ -n "$NAMESPACE" ]; then
          echo "Operating in namespace: ${NAMESPACE}"
          NS_ARG="-n ${NAMESPACE}"
        fi

        # 3. Poll for the OpenShift Route
        MAX_RETRIES=20
        COUNT=0
        ROUTE_HOST=""

        while [ $COUNT -lt $MAX_RETRIES ]; do
          ROUTE_HOST=$(oc get route ${NS_ARG} -l controller.devfile.io/endpoint_name=rhdh-route -o jsonpath='{.items[0].spec.host}' 2>/dev/null)
          
          if [ -z "$ROUTE_HOST" ]; then
            ROUTE_HOST=$(oc get route ${NS_ARG} -o jsonpath='{.items[?(@.spec.port.targetPort==7007)].spec.host}' 2>/dev/null)
          fi

          if [ -n "$ROUTE_HOST" ]; then
            break
          fi

          COUNT=$((COUNT + 1))
          echo "Route not ready yet... retry $COUNT/$MAX_RETRIES"
          sleep 2
        done

        if [ -n "$ROUTE_HOST" ]; then
          DYNAMIC_URL="https://${ROUTE_HOST}"
          echo "Discovered URL: ${DYNAMIC_URL}"
          if [ -f .env ]; then
            sed -i "s|^BASE_URL=.*|BASE_URL=${DYNAMIC_URL}|" .env
            echo ".env successfully updated with ${DYNAMIC_URL}"
          fi
        else
          echo "WARNING: OpenShift Route was not found within timeout."
        fi
events:
  postStart:
    - install-podman-compose
    - start-podman-service
    - sync-env-url